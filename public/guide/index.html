<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>上海大学新生入校交通指南 · 电子版</title>
<script src="assets/guide-styles.js"></script>
<script src="data/guide-icons.js"></script>
<!-- 离线校对种子：仅在接口够不着（断网 / file://）时兜底并明确标注；
     接口回答 404（管理端未发布 / 已下线）时不使用它。正式内容来自 D1 -->
<script src="data/guide-seed.js"></script>
<script src="assets/guide-render.js"></script>
<style>
/* ══════════════ 页面骨架（仅本页使用，组件样式见 guide-styles.js） ══════════════
 * 屏幕 UI 全包在 #gc-screen 里：@media print 时 guide-styles.js 隐藏它、
 * 显示 buildPrintRoot 生成的 .gc-print-root。 */
#gc-screen{max-width:1180px;margin:0 auto;padding:0 20px 48px}

/* ── 顶栏 ── */
.gc-topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;
  gap:10px 14px;flex-wrap:wrap;margin:0 -20px;padding:12px 20px;
  background:rgba(245,246,248,.94);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line)}
.gc-topbar__title{display:flex;align-items:baseline;gap:8px;min-width:0;flex-wrap:wrap}
.gc-topbar__big{font-size:20px;font-weight:700;line-height:28px;letter-spacing:-.01em}
.gc-topbar__small{font-size:14px;font-weight:600;line-height:20px;color:var(--ink-2)}
.gc-topbar__edition{font-size:12px;font-weight:500;line-height:17px;color:var(--sub);
  letter-spacing:.02em}
.gc-srcbadge{font-size:11px;font-weight:600;line-height:16px;padding:2px 9px;
  border-radius:999px;letter-spacing:.03em;white-space:nowrap}
.gc-srcbadge[data-tone="warn"]{color:var(--warning-ink);background:var(--warning-bg);
  border:1px solid var(--warning-line)}

.gc-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink-2);font:inherit;font-size:13px;
  font-weight:600;line-height:19px;padding:7px 14px;border-radius:var(--r-sm);
  cursor:pointer;text-decoration:none;white-space:nowrap;
  transition:border-color .15s ease,color .15s ease,background .15s ease}
.gc-btn:hover{border-color:var(--primary);color:var(--primary)}
.gc-btn--primary{background:var(--primary);border-color:var(--primary);color:#fff}
.gc-btn--primary:hover{background:var(--primary-pressed);border-color:var(--primary-pressed);
  color:#fff}

/* ── 出发 × 到达 选择器 ── */
.gc-picker{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;
  margin:20px 0 8px}
.gc-pick-col{min-width:0}
.gc-pick-col__label{font-size:13px;font-weight:600;line-height:19px;color:var(--sub);
  letter-spacing:.06em;margin-bottom:8px}
.gc-pick-list{display:flex;flex-direction:column;gap:8px}
.gc-pick-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-md);padding:11px 14px;cursor:pointer;
  box-shadow:var(--shadow-card);
  transition:border-color .15s ease,background .15s ease,box-shadow .15s ease}
.gc-pick-item:hover{border-color:var(--primary)}
.gc-pick-item.is-active{border-color:var(--primary);background:var(--primary-container)}
.gc-pick-item:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.gc-pick-item:disabled:hover{border-color:var(--line)}
.gc-pick-dot{flex:none;width:12px;height:12px;border-radius:50%}
.gc-pick-main{display:flex;align-items:baseline;gap:8px;min-width:0;flex-wrap:wrap}
.gc-pick-name{font-size:15px;font-weight:600;line-height:22px}
.gc-pick-note{font-size:12px;font-weight:500;line-height:17px;color:var(--sub)}
.gc-pick-count{flex:none;margin-left:auto;font-size:12px;font-weight:600;line-height:17px;
  color:var(--sub);background:var(--chip);padding:2px 9px;border-radius:999px;
  font-variant-numeric:tabular-nums}

/* ── 出行方式筛选 chips（当前组合 >1 种方式时才出现） ── */
.gc-modebar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:12px 0 16px}
.gc-modebar__label{font-size:12px;font-weight:500;line-height:17px;color:var(--sub);
  letter-spacing:.04em}
.gc-chip{font:inherit;font-size:13px;font-weight:600;line-height:19px;padding:5px 14px;
  border-radius:999px;border:1px solid var(--line);background:var(--surface);
  color:var(--ink-2);cursor:pointer;
  transition:border-color .15s ease,background .15s ease,color .15s ease}
.gc-chip:hover{border-color:var(--primary)}
.gc-chip.is-on{background:var(--primary);border-color:var(--primary);color:#fff}

/* ── 结果区与页脚 ── */
.gc-result{min-height:200px}
.gc-foot{margin-top:40px;padding-top:14px;border-top:1px solid var(--line);
  font-size:12px;line-height:18px;color:var(--faint);text-align:center;
  letter-spacing:.02em}

/* ── 窄屏：选择器堆叠，顶栏收紧 ── */
@media screen and (max-width:720px){
  .gc-picker{grid-template-columns:minmax(0,1fr)}
  .gc-topbar__big{font-size:17px;line-height:24px}
  .gc-topbar__small{font-size:13px}
}
</style>
</head>
<body>

<!-- 屏幕 UI：打印时整体隐藏（guide-styles.js 的 @media print 规则） -->
<div id="gc-screen">
  <header class="gc-topbar">
    <div class="gc-topbar__title">
      <span class="gc-topbar__big" id="meta-title">上海大学</span>
      <span class="gc-topbar__small" id="meta-subtitle">新生入校交通指南</span>
    </div>
    <span class="gc-topbar__edition" id="edition"></span>
    <span class="gc-srcbadge" id="src-badge" hidden></span>
    <span class="gc-spacer"></span>
    <button type="button" class="gc-btn gc-btn--primary" id="btn-pdf">导出 PDF</button>
  </header>

  <main>
    <!-- 核心交互：左边选出发枢纽，右边选到达校区（只列当前枢纽有卡的校区） -->
    <section class="gc-picker" aria-label="选择出发枢纽与到达校区">
      <div class="gc-pick-col">
        <div class="gc-pick-col__label">出发</div>
        <div class="gc-pick-list" id="pick-hub" role="group" aria-label="出发枢纽"></div>
      </div>
      <div class="gc-pick-col">
        <div class="gc-pick-col__label">到达</div>
        <div class="gc-pick-list" id="pick-campus" role="group" aria-label="到达校区"></div>
      </div>
    </section>

    <!-- 出行方式筛选：chips 由当前组合的路线卡动态生成 -->
    <div class="gc-modebar" id="mode-bar" hidden></div>

    <div class="gc-result" id="result"></div>
  </main>

  <footer class="gc-foot" id="foot" hidden></footer>
</div>

<script>
/*
 * 外壳启动分两步：先取内容，再渲染。
 *
 * 内容来自 GET /api/public/guide/:slug（管理端审核通过并发布的那一版）——
 * 标题、版次、第几版这些「标识」也一律以接口返回为准，不用页面里写死的文案。
 *
 * 种子文件 data/guide-seed.js 只是出厂校对稿：只在「接口根本够不着」
 * （断网、file:// 直接打开）时兜底，且顶栏必须标出「离线稿」。
 * 接口能到达但回答 404 —— 那是管理端说「未发布 / 已下线」，必须照办，
 * 不能拿种子冒充线上内容。无论哪条路径，数据都先过 normalizeData 再使用。
 */
(function () {
  "use strict";
  var R = window.GuideRender;
  var SLUG = (function () {
    var m = /[?&]slug=([a-z0-9-]{3,64})/.exec(location.search);
    return m ? m[1] : 'freshman-transit';
  })();

  var resultEl = document.getElementById('result');
  var modeBar = document.getElementById('mode-bar');
  var hubListEl = document.getElementById('pick-hub');
  var campusListEl = document.getElementById('pick-campus');

  function setStatus(text, tone) {
    var el = document.getElementById('src-badge');
    el.textContent = text || '';
    el.dataset.tone = tone || '';
    el.hidden = !text;
  }

  function splash(text) {
    modeBar.hidden = true;
    resultEl.textContent = '';
    resultEl.appendChild(R.h('div', { class: 'gc-empty', text: text }));
  }

  splash('正在载入指南内容…');

  fetch('/api/public/guide/' + encodeURIComponent(SLUG), { credentials: 'same-origin' })
    .then(function (res) {
      if (res.status === 404) {
        /* 管理端未发布 / 已下线：尊重发布状态，不回落种子 */
        var err = new Error('unpublished');
        err.unpublished = true;
        throw err;
      }
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    })
    .then(function (payload) {
      if (!payload || !payload.content || !payload.content.cards) throw new Error('内容为空');
      setStatus('', '');
      boot(payload.content, {
        title: payload.title,
        edition: payload.edition,
        revisionNo: payload.revisionNo,
      });
    })
    .catch(function (err) {
      if (err && err.unpublished) return splash('该指南暂未发布或已下线');
      var seed = window.GUIDE_DATA;
      if (!seed || !seed.cards) return splash('无法载入指南内容：' + err.message);
      setStatus('离线稿', 'warn');
      boot(seed, {});
    });

  /* ── 页面状态 ── */
  var D = null;            /* normalizeData 之后的 v2 数据 */
  var printRoot = null;    /* buildPrintRoot 生成的离屏打印树，只 append 一次 */
  var state = { hub: '', campus: '', modesOff: {} };  /* modesOff：被关掉的出行方式 */

  function boot(raw, info) {
    D = R.normalizeData(raw);
    if (!D || !(D.cards || []).length) return splash('指南数据为空或格式不正确');

    /* 标题与版次标识：线上以管理端发布记录为准，种子兜底才用内容里的 meta */
    var meta = D.meta || {};
    var title = (info && info.title) || meta.title || '上海大学';
    var subtitle = meta.subtitle || '';
    var edition = (info && info.edition) || meta.edition || '';
    document.getElementById('meta-title').textContent = title;
    document.getElementById('meta-subtitle').textContent = subtitle;
    document.getElementById('edition').textContent = edition;
    document.title = title + subtitle + (edition ? ' ' + edition : '') + ' · 电子版';

    /* 页脚版本行：有数据才显示；线上内容带上发布版次 */
    var footBits = [];
    if (meta.version) footBits.push('版本 ' + meta.version);
    if (meta.revisedAt) footBits.push('修订于 ' + meta.revisedAt);
    if (info && typeof info.revisionNo === 'number') footBits.push('第 ' + info.revisionNo + ' 版发布稿');
    var foot = document.getElementById('foot');
    foot.textContent = footBits.join(' · ');
    foot.hidden = !footBits.length;

    /* 打印树随数据（重新）加载而刷新；屏幕/打印切换纯 CSS，无需打印前再动它 */
    if (printRoot) printRoot.remove();
    printRoot = R.buildPrintRoot(D);
    document.body.appendChild(printRoot);

    var hubs = sortedHubs();
    if (!hubs.length) return splash('暂无枢纽数据');

    /* 深链 #h=<hubId>&c=<campusId>：无效项回落到默认（首个枢纽 × 首个有卡校区） */
    var fromHash = parseHash();
    state.hub = (fromHash.h && hubById(fromHash.h)) ? fromHash.h : hubs[0].id;
    state.campus = validCampus(state.hub, fromHash.c);
    state.modesOff = {};

    buildHubList(hubs);
    buildCampusList();
    syncPicker();
    render();
    updateHash();
  }

  /* ── 数据查询 ── */
  function sortedHubs() {
    return (D.hubs || []).slice().sort(function (a, b) {
      return (a.order || 0) - (b.order || 0);
    });
  }
  function hubById(id) {
    var list = D.hubs || [];
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }
  function campusById(id) {
    var list = D.campuses || [];
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }
  function cardCount(hubId, campusId) {
    var n = 0;
    (D.cards || []).forEach(function (c) {
      if (c.hub === hubId && c.campus === campusId) n++;
    });
    return n;
  }
  /* 校区 id 必须在数据里且当前枢纽下有卡，否则回落到第一个有卡校区 */
  function validCampus(hubId, campusId) {
    if (campusId && campusById(campusId) && cardCount(hubId, campusId) > 0) return campusId;
    var list = D.campuses || [];
    for (var i = 0; i < list.length; i++)
      if (cardCount(hubId, list[i].id) > 0) return list[i].id;
    return list.length ? list[0].id : '';
  }

  var MODE_LABEL = { metro: '地铁', bus: '公交', maglev: '磁浮', airport: '市域线',
                     rail: '铁路', mixed: '联程', other: '其他' };
  /* 当前组合的路线卡里真实出现的出行方式（按卡片顺序去重） */
  function modesFor(hubId, campusId) {
    var seen = {}, out = [];
    (D.cards || []).forEach(function (c) {
      if (c.hub !== hubId || c.campus !== campusId || c.kind !== 'route' || !c.mode) return;
      if (seen[c.mode]) return;
      seen[c.mode] = 1;
      out.push({ mode: c.mode, label: c.modeLabel || MODE_LABEL[c.mode] || c.mode });
    });
    return out;
  }

  /* ── 选择器 ── */
  function buildHubList(hubs) {
    hubListEl.textContent = '';
    hubs.forEach(function (hub) {
      var b = R.h('button', { class: 'gc-pick-item', type: 'button', dataset: { id: hub.id } },
        R.h('span', { class: 'gc-pick-dot', style: 'background:' + (hub.color || '#465060') }),
        R.h('span', { class: 'gc-pick-main' },
          R.h('span', { class: 'gc-pick-name', text: hub.name }),
          hub.note ? R.h('span', { class: 'gc-pick-note', text: hub.note }) : null
        )
      );
      b.addEventListener('click', function () { pickHub(hub.id); });
      hubListEl.appendChild(b);
    });
  }

  function buildCampusList() {
    campusListEl.textContent = '';
    (D.campuses || []).forEach(function (camp) {
      var n = cardCount(state.hub, camp.id);
      var b = R.h('button', {
        class: 'gc-pick-item', type: 'button',
        dataset: { id: camp.id }, disabled: n === 0,
      },
        R.h('span', { class: 'gc-pick-main' },
          R.h('span', { class: 'gc-pick-name', text: camp.label || camp.id })),
        R.h('span', { class: 'gc-pick-count', text: n > 0 ? String(n) : '暂无' })
      );
      if (n > 0) b.addEventListener('click', function () { pickCampus(camp.id); });
      campusListEl.appendChild(b);
    });
  }

  function syncPicker() {
    hubListEl.querySelectorAll('.gc-pick-item').forEach(function (b) {
      var on = b.dataset.id === state.hub;
      b.classList.toggle('is-active', on);
      b.setAttribute('aria-pressed', String(on));
    });
    campusListEl.querySelectorAll('.gc-pick-item').forEach(function (b) {
      var on = b.dataset.id === state.campus;
      b.classList.toggle('is-active', on);
      b.setAttribute('aria-pressed', String(on));
    });
  }

  function pickHub(id) {
    if (state.hub === id) return;
    state.hub = id;
    if (cardCount(id, state.campus) === 0) state.campus = validCampus(id, null);
    state.modesOff = {};
    buildCampusList();
    syncPicker();
    render();
    updateHash();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  function pickCampus(id) {
    if (state.campus === id) return;
    state.campus = id;
    state.modesOff = {};
    syncPicker();
    render();
    updateHash();
  }

  /* ── 出行方式筛选：>1 种方式才显示；全部默认开，可多点切换 ── */
  function syncModeBar(modes) {
    modeBar.textContent = '';
    if (modes.length <= 1) { modeBar.hidden = true; return; }
    modeBar.hidden = false;
    modeBar.appendChild(R.h('span', { class: 'gc-modebar__label', text: '出行方式' }));
    modes.forEach(function (m) {
      var on = !state.modesOff[m.mode];
      var b = R.h('button', {
        class: 'gc-chip' + (on ? ' is-on' : ''), type: 'button',
        'aria-pressed': String(on), text: m.label,
      });
      b.addEventListener('click', function () {
        if (state.modesOff[m.mode]) delete state.modesOff[m.mode];
        else state.modesOff[m.mode] = 1;
        render();
      });
      modeBar.appendChild(b);
    });
  }

  /* ── 渲染：筛选 chips + 组合页（卡片栅格 / 枢纽指引 / 实况指引 / 备注） ── */
  function render() {
    var modes = modesFor(state.hub, state.campus);
    /* 掉出当前组合的方式清掉开关记录，免得状态越积越脏 */
    var off = {};
    modes.forEach(function (m) { if (state.modesOff[m.mode]) off[m.mode] = 1; });
    state.modesOff = off;
    syncModeBar(modes);

    var filter = null;
    if (modes.length > 1) {
      filter = modes.filter(function (m) { return !state.modesOff[m.mode]; })
        .map(function (m) { return m.mode; });
    }
    R.renderPairView(resultEl, D, state.hub, state.campus, {
      modeFilter: filter,
      onInternalLink: onInternalLink,
    });
  }

  /* 热区弹层里的内部链接：#card: 由渲染层自己滚动定位，其余在这里兜底 */
  function onInternalLink(href) {
    if (/^#shumap:/.test(href)) return R.toast('将深链到 SHUMap 地图页（接入后生效）');
    if (/^#wechat:/.test(href)) return R.toast('微信公众号购票入口（接入后生效）');
    R.toast('内部链接：' + href);
  }

  /* ── 深链 ── */
  function parseHash() {
    var out = { h: null, c: null };
    var q = location.hash.replace(/^#/, '');
    if (!q) return out;
    q.split('&').forEach(function (kv) {
      var m = /^([hc])=(.+)$/.exec(kv);
      if (m) out[m[1]] = decodeURIComponent(m[2]);
    });
    return out;
  }
  function updateHash() {
    try {
      history.replaceState(null, '', '#h=' + encodeURIComponent(state.hub) +
        '&c=' + encodeURIComponent(state.campus));
    } catch (e) { /* file:// 等场景 replaceState 可能受限，忽略 */ }
  }

  /* ── 导出 PDF：打印输出完全来自 buildPrintRoot 的离屏树，直接调起打印 ── */
  document.getElementById('btn-pdf').addEventListener('click', function () {
    R.toast('在打印对话框中选择「另存为 PDF」');
    R.whenPrintReady(printRoot, function () { window.print(); });
  });
})();
</script>
</body>
</html>
